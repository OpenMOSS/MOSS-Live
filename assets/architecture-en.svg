<rect x="76" y="192" width="264" height="170" rx="20" fill="white" stroke="#1F2329" stroke-width="1.6"/>
<circle cx="208" cy="225" r="12" fill="none" stroke="#1F2329" stroke-width="2"/><path d="M186 260 Q208 232 230 260" fill="none" stroke="#1F2329" stroke-width="2" stroke-linecap="round"/>
<text x="208" y="294" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1F2329" font-weight="700" text-anchor="middle">User</text>
<text x="208" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#646A73" font-weight="400" text-anchor="middle">Speak or interrupt at any time</text>
