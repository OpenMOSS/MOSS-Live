<rect width="1400" height="1000" fill="white"/>
<text x="38" y="55" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#1F2329" font-weight="700" text-anchor="start">MOSS-Live: Foreground–Background Architecture</text>
<line x1="40" y1="89" x2="82" y2="89" stroke="#3370FF" stroke-width="2.4"/>
<text x="94" y="95" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#646A73" font-weight="400" text-anchor="start">Real-time interaction</text>
