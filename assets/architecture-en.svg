<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="architecture-en-title architecture-en-desc" lang="en">
<title id="architecture-en-title">MOSS-Live: Foreground–Background Architecture</title>
<desc id="architecture-en-desc">The foreground model handles real-time full-duplex interaction while the background model executes tasks asynchronously. Both share memory, context, and task state. Conversation continues during task execution.</desc>
